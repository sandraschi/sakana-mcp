repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: biome-frontend
        name: biome (frontend)
        entry: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/pre-commit-biome.ps1
        language: system
        types: [file]
        files: ^webapp/frontend/src/.*\.(ts|tsx|js|jsx|json)$
        pass_filenames: false
      - id: no-bak-staged
        name: no timestamped .bak files
        entry: 'powershell.exe -NoProfile -Command "$bad = git diff --cached --name-only | Where-Object { $_ -match ''\.bak(\.|$)'' }; if ($bad) { Write-Host (''Refusing .bak files: '' + ($bad -join '', '')); exit 1 }"'
        language: system
        always_run: true
        pass_filenames: false
